[package]
name = "rustdoc_assist"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.0"
fastembed = "6.0.2"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "search_bench"
harness = false

[lib]
name = "rustdoc_assist"
path = "src/lib.rs"